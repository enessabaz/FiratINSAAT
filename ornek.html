<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Proje Gösterimi</title>
    
    <!-- Google Model Viewer Kütüphanesi -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    
    <style>
        /* Genel Sayfa Ayarları */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 3D Modeli Kapsayan Alan */
        .model-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .model-container h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* 3D Görüntüleyici Stili */
        model-viewer {
            width: 100%;
            height: 600px;
            background-color: #e9ecef;
            border-radius: 8px;
            outline: none;
            /* Yüklenirken gösterilecek olan stil */
            --poster-color: transparent;
        }

        /* Mobil Ekranlar İçin Düzenleme (Responsive) */
        @media (max-width: 768px) {
            .model-container {
                border-radius: 0;
                padding: 10px;
            }
            model-viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="model-container">
        <h2>Örnek Proje 3D İnceleme</h2>
        
        <!-- 3D Modelin Yüklendiği Alan -->
        <!-- NOT: 'src' kısmına kendi elde ettiğin .glb veya .gltf dosyasının yolunu yazmalısın -->
        <model-viewer 
            src="giris1.jpg" 
            alt="Projenin 3D Görseli" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1"
            environment-image="neutral"
            exposure="1.1"
            interaction-prompt="auto">
        </model-viewer>
    </div>

</body>
</html>
